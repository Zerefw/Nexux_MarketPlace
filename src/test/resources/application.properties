spring.application.name=market_place
server.port=0

# Base de datos en memoria para ejecucion automatica de tests
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Configuracion de Seguridad JWT para tests
app.jwt.secret=unaClaveSecretaMuyLargaYSeguraDeAlMenos256BitsParaNexusMarketPlace2026
app.jwt.expiration-ms=86400000
