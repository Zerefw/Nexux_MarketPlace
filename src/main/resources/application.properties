spring.application.name=market_place
server.port=8080

# ==============================================================================
# Conexion a MySQL en Docker / Local (Puerto 3306)
# ==============================================================================
spring.datasource.url=jdbc:mysql://localhost:3306/nexus_marketplace?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=0000
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracion JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Configuracion de Seguridad JWT
app.jwt.secret=unaClaveSecretaMuyLargaYSeguraDeAlMenos256BitsParaNexusMarketPlace2026
app.jwt.expiration-ms=86400000
